# Checks every push and pull request, and on main publishes the production
# images to GitHub's container registry (ghcr.io). Watchtower on the server
# (docker-compose.prod.yml) notices the new images and restarts the app.
#
#   ghcr.io/<owner>/bgg-game-night-api:latest   (also tagged sha-<commit>)
#   ghcr.io/<owner>/bgg-game-night-web:latest

name: Check and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: read

# A newer push to the same branch cancels an older run that's still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json

      - name: API — install
        working-directory: api
        run: npm ci
      - name: API — typecheck
        working-directory: api
        run: npm run typecheck
      - name: API — tests
        working-directory: api
        run: npm test

      - name: Web — install
        working-directory: web
        run: npm ci
      - name: Web — typecheck and build
        working-directory: web
        run: npm run build

  publish:
    # Only main is deployed; branches and pull requests are just checked.
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (registry names must be lower case)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          target: prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
