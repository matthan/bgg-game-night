# Production web server (docker-compose.prod.yml).
# Serves the built React app and forwards /api/* to the API container —
# the same job Vite's proxy does during development.
server {
  listen 80;
  root /usr/share/nginx/html;

  # Look the API up through Docker's DNS on each request (cached 10s) instead
  # of once at startup: when Watchtower updates only the API container, it can
  # come back on a new IP address, and nginx would keep calling the old one.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3001;

  location /api/ {
    proxy_pass $api_upstream; # no path after the host: the request URI is passed as is
    proxy_set_header Host $host;
    proxy_read_timeout 120s; # a first sync of a big collection can take a while
  }

  # Fingerprinted build files can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Anything else is the React app.
  location / {
    try_files $uri /index.html;
  }
}
